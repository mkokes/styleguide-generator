<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Walk through your brand's colors, type, spacing and rules to produce an agent-ready STYLEGUIDE.md and design tokens."
    />
    <meta name="theme-color" content="#FFFFFF" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Styleguide Generator</title>
    <script>
      // Apply the saved or system theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem("theme");
        if (t !== "light" && t !== "dark") {
          t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = t;
        // Browser chrome follows the chosen mode; the theme hook keeps it in step afterwards.
        document.querySelector('meta[name="theme-color"]').content =
          t === "dark" ? "#242424" : "#FFFFFF";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
